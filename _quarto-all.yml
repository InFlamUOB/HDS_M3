# Working render:  make preview      (or: quarto render --profile all)
#
# Every chapter that is finished, whether or not students can see it yet.
# _quarto.yml holds the released list and builds _book/, which is the website;
# this profile builds _book-all/, which is git-ignored and never published.
#
# When you finish a chapter, add it here. When you release a day, uncomment
# that day in _quarto.yml as well — `make check` fails if a chapter is in the
# released list but missing from this one.
project:
  output-dir: _book-all

book:
  subtitle: "Exercise booklet — ALL DAYS, including unreleased"
  chapters:
    - index.qmd
    - part: "Day 1 — Introduction"
      chapters:
        - day1-01a-PythonvsR.qmd
        - day1-02-first-pipeline.qmd
    - part: "Day 2 — EDA and Data Wrangling"
      chapters:
        - day2-00-histograms-boxplots.qmd
        - day2-01-correlation-missingness.qmd
        - day2-02-cleaning-encoding.qmd
        - day2-03a-imputation.qmd
        - day2-03b-scaling.qmd
        - day2-04a-pipeline.qmd
    - part: "Day 3 — Supervised Learning.Linear Regression"
      chapters:
        - day3-01-supervised-learning.qmd
        - day3-02-loss-functions.qmd
        - day3-02b-best-fit-line.qmd
        - day3-03-gradient-descent.qmd
        - day3-04-ols.qmd
