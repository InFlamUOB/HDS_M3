# Instructor render:  quarto render --profile instructor
# Same booklet plus worked solutions, model answers, expected values, timings
# and the marking rubric. Separate output directory so it can never be
# published to the student site by accident.
project:
  output-dir: _book-instructor

book:
  subtitle: "HDS MSc · Module 3 · Interactive exercise booklet — INSTRUCTOR COPY"

format:
  live-html:
    theme:
      light: [cosmo, theme.scss]
