# Publishes the booklet to GitHub Pages.
#
# The site is NOT built here. You render it on your own machine, where R and
# Python live, and commit the _book/ folder; this job simply publishes that
# folder. The consequence is worth the trade: what students see is byte for byte
# what you saw locally, with no dependence on which Quarto version a runner
# happens to install.
#
# So the rule is: after changing a chapter, `make site`, then commit _book/
# along with your change. `make check` and the link check guard the rest.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Publish booklet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the chapters
        run: python3 scripts/check_cells.py

      - name: Check that the rendered site is committed and current
        run: |
          if [ ! -f _book/index.html ]; then
            echo "::error::_book/index.html is missing. Run 'make site' and commit _book/."
            exit 1
          fi
          newer=$(find . -name '*.qmd' -newer _book/index.html -not -path './_book/*' -print -quit)
          if [ -n "$newer" ]; then
            echo "::error::$newer is newer than the rendered site. Run 'make site' and commit _book/."
            exit 1
          fi

      - name: Check for dead links and unresolved cross-references
        run: python3 scripts/check_links.py _book

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _book

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
