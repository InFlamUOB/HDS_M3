# Renders the booklet and publishes it to GitHub Pages on every push to main.
# The chapters execute when YOU render locally; the results are committed in
# _freeze/, so this job replays them and needs Quarto alone - no R, no Python.
# Render locally and commit _freeze/ whenever you change a chapter's code.
#
# One-time setup, in the repository: Settings -> Pages -> Build and deployment
# -> Source: GitHub Actions.
#
# The instructor build is deliberately NOT produced here. It is rendered locally
# with `make instructor`, so solutions cannot reach the public site by accident.

name: Publish booklet

on:
  push:
    branches: [main]
    paths-ignore:
      - 'print/**'
      - '**/*.pdf'
  # Pull requests get the same checks and the same render, but are not
  # deployed - so a change can be proved safe before it is published.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32

      - name: Check the chapters
        run: python3 scripts/check_cells.py

      - name: Check that the executed output is committed
        run: |
          if [ ! -d _freeze ]; then
            echo "::error::_freeze/ is missing. Render locally (make site) and commit it, or the published chapters will have no output."
            exit 1
          fi

      - name: Render student booklet
        run: quarto render --to live-html

      - name: Check for dead links and unresolved cross-references
        run: python3 scripts/check_links.py _book

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _book

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
