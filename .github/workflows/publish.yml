# Publishes site/ to GitHub Pages.
#
# The site is NOT built here. You render on your own machine, where R and Python
# live, and commit site/; this job publishes that folder as it stands. What
# students see is byte for byte what you saw locally.
#
# site/ holds a homepage and one folder per released day:
#
#     site/index.html     links the released days
#     site/day1/          Day 1, at its own address
#
# A day changes only when you release it again with `make release DAY=n` and
# commit the result. Editing a chapter does not, by itself, change anything a
# student can see, so there is deliberately no check here that site/ is newer
# than the chapters.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Publish booklet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the chapters
        run: python3 scripts/check_cells.py

      - name: Check that the site is committed
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html is missing. Run 'make release DAY=1' and commit site/."
            exit 1
          fi
          echo "Published days:"; ls -d site/day*/ 2>/dev/null || echo "  none"

      - name: Check that no released page shows an answer or an instructor note
        run: |
          # A day released with ANSWERS=1 carries the marker file answers-released.
          bad=0
          for d in site/day*/; do
            [ -f "$d/answers-released" ] && continue
            if grep -l "Worked answer" "$d"*.html; then
              echo "::error::$d shows worked answers but was not released with ANSWERS=1."
              bad=1
            fi
          done
          if grep -rlE "Expected values|Common failures" site --include=*.html; then
            echo "::error::A published page contains instructor notes."
            bad=1
          fi
          exit $bad

      - name: Check for dead links and unresolved cross-references
        run: python3 scripts/check_links.py site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
