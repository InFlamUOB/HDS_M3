project:
  type: book
  output-dir: _book
  resources:
    - data/

book:
  title: "Machine Learning for Health Data"
  subtitle: "HDS MSc · Module 3 · Exercise booklet"
  author: "Centre for Health Data Science"
  date: today
  date-format: "MMMM YYYY"
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  page-footer:
    left: "HDS MSc · Module 3"
    right: "Code to read, copy and run yourself"
  chapters:
    - index.qmd
    - part: "Day 1 — From code to a model that might be wrong"
      chapters:
        - day1-00-overview.qmd
        - day1-01-two-languages.qmd
        - day1-02-first-pipeline.qmd
        - day1-03-distribution-shift.qmd
        - day1-04-consolidation.qmd
    - roadmap.qmd
  appendices:
    - setup.qmd
    - appendix/data.qmd
    - appendix/troubleshooting.qmd
    - appendix/glossary.qmd
    - appendix/add-a-day.qmd
    - appendix/instructor.qmd

bibliography: references.bib

engine: knitr

# Chapters execute when rendered, so the site shows each worked example with
# its output. Results are cached in _freeze/, which is committed, so GitHub
# publishes without needing R or Python.
execute:
  freeze: auto
  warning: false
  message: false

# Worked answers are written into the chapters but excluded from the output
# until this is flipped to true and pushed - that is how a day's solutions are
# released after the session.
show-solutions: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true

