project:
  type: book
  output-dir: _book
  resources:
    - data/

book:
  title: "Foundation of Machine Learning for Health Data Science"
  subtitle: "Exercise booklet"
  author: "Laura Bravo"
  date: today
  date-format: "MMMM YYYY"
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  page-footer:
    left: "HDS MSc · Module 3"
    right: "Code to read, copy and run yourself"
  chapters:
    - index.qmd
    - part: "Day 1 — Introduction"
      chapters:
        - day1-01-two-languages.qmd
        - day1-02-first-pipeline.qmd
        - day1-03-distribution-shift.qmd
    - part: "Day 2 — EDA and Data Wrangling"
      chapters:
        - day2-01-first-look.qmd
        - day2-02-missing-data.qmd
        - day2-03-transforming.qmd
        - day2-04-leakage.qmd
        - day2-05-resampling.qmd
    - part: "Day 3 — Supervised Learning.Linear Regression"
      chapters:
        - day3-01-supervised-learning.qmd
        - day3-02-loss-functions.qmd
        - day3-03-gradient-descent.qmd
        - day3-04-ols.qmd
    - part: "Day 4 — Supervised Learning.Logistic Regression"
      chapters:
        - day4-01-frameworks.qmd
        - day4-02-logistic-regression.qmd
        - day4-03-thresholds.qmd
        - day4-04-calibration.qmd
    - part: "Day 5 — Supervised Learning.Regularization&Trees"
      chapters:
        - day5-01-regression-metrics.qmd
        - day5-02-classification-metrics.qmd
        - day5-03-decision-trees.qmd
        - day5-04-random-forest.qmd
        - day5-05-regularisation.qmd
    - part: "Day 9 — Explainable AI"
      chapters:
        - day6-01-importance.qmd
        - day6-02-shap.qmd
        - day6-03-dalex.qmd
        - day6-04-subgroups.qmd
  appendices:
    - appendix/glossary.qmd

bibliography: references.bib

engine: knitr

# Chapters execute when rendered, so the site shows each worked example with
# its output. Results are cached in _freeze/, which is committed, so GitHub
# publishes without needing R or Python.
execute:
  freeze: auto
  warning: false
  message: false

# Worked answers are written into the chapters but excluded from the output
# until this is flipped to true and pushed - that is how a day's solutions are
# released after the session.
show-solutions: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true

