project:
  type: book
  output-dir: _book
  resources:
    - data/
    - checks/

book:
  title: "Machine Learning for Health Data"
  subtitle: "HDS MSc · Module 3 · Interactive exercise booklet"
  author: "Centre for Health Data Science"
  date: today
  date-format: "MMMM YYYY"
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  page-footer:
    left: "HDS MSc · Module 3"
    right: "Runs in your browser — nothing to install"
  chapters:
    - index.qmd
    - part: "Day 1 — From code to a model that might be wrong"
      chapters:
        - day1-00-overview.qmd
        - day1-01-two-languages.qmd
        - day1-02-first-pipeline.qmd
        - day1-03-distribution-shift.qmd
        - day1-04-consolidation.qmd
    - roadmap.qmd
  appendices:
    - setup.qmd
    - appendix/data.qmd
    - appendix/troubleshooting.qmd
    - appendix/glossary.qmd
    - appendix/add-a-day.qmd
    - appendix/instructor.qmd

bibliography: references.bib

engine: knitr

format:
  live-html:
    theme:
      light: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true

# Client-side runtimes. These lists are downloaded once per browser and cached;
# the R side is about 48 MB, the Python side about 15 MB.
webr:
  packages: [readr, dplyr, ggplot2, parsnip, rsample, yardstick, rpart]
  cell-options:
    autorun: false
    completion: true
    persist: true
pyodide:
  packages: [pandas, numpy, matplotlib, scikit-learn]
  cell-options:
    autorun: false
    completion: true
    persist: true

resources:
  - data/los_data.csv
  - data/extract_A.csv
  - data/extract_B.csv
  - data/extract_C.csv
  - data/birthweight.csv
  - checks/checks.R
  - checks/checks.py
